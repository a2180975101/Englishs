<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#58cc02">
  <meta name="description" content="词跃 WordLeap：四级高频 300 词闯关复习，30 关 / 每关 10 词，选择题、拼写、选词填空与错词复习。">
  <title>词跃 WordLeap · 四级高频 300 词</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2358cc02'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='900' text-anchor='middle' fill='%23fff'%3E跃%3C/text%3E%3C/svg%3E">
  <style>
/* ==========================================================
   词跃 WordLeap · 样式表
   设计方向：多邻国式「游戏化学习」——大圆角、厚底阴影、
   高饱和绿色、轻松活泼的插画感。
   ========================================================== */

:root {
  --green: #58cc02;
  --green-bright: #61d800;
  --green-dark: #46a302;
  --green-deep: #2f7a00;
  --green-soft: #e9fbd8;
  --green-mid: #d7ffb8;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --blue-soft: #ddf4ff;
  --purple: #ce82ff;
  --purple-dark: #a568cc;
  --purple-soft: #f3e7ff;
  --yellow: #ffc800;
  --yellow-dark: #e0a800;
  --yellow-soft: #fff4c6;
  --orange: #ff9600;
  --red: #ff4b4b;
  --red-dark: #e03535;
  --red-soft: #ffe4e5;
  --ink: #3c3c3c;
  --ink-2: #5a5a5a;
  --muted: #8f8f8f;
  --line: #e5e5e5;
  --soft: #f7f7f7;
  --cream: #f1f6e9;
  --radius: 18px;
  --frame: 480px;
  --font: "Segoe UI Variable Display", "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", system-ui,
    -apple-system, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(900px 500px at 12% -10%, #e5f6d2 0%, rgba(229, 246, 210, 0) 60%),
    radial-gradient(800px 600px at 100% 100%, #e8f2ff 0%, rgba(232, 242, 255, 0) 55%),
    var(--cream);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input { font-family: inherit; }
button { cursor: pointer; border: 0; background: none; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
svg { display: block; }
.ico { width: 22px; height: 22px; flex: none; }

/* ============ 应用外壳 ============ */

.app {
  width: 100%;
  max-width: var(--frame);
  min-height: 100vh;
  margin: 0 auto;
  background: #fff;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 80px rgba(64, 96, 32, 0.10);
}

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.screen-host { flex: 1; }

.screen {
  padding: 10px 20px 104px;
  animation: screenIn 0.34s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}

/* 答题 / 结算：隐藏底部标签栏 */
body.focus-mode .tabbar { display: none; }
body.focus-mode .screen { padding-bottom: 0; }

/* ============ 通用组件 ============ */

.btn {
  --btn-shadow: #d0d0d0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 52px;
  padding: 0 20px;
  border-radius: 15px;
  font-size: 15.5px;
  font-weight: 850;
  letter-spacing: 0.4px;
  color: #fff;
  background: var(--green);
  box-shadow: 0 4px 0 var(--btn-shadow);
  transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
  user-select: none;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--btn-shadow); }
.btn:disabled { background: #e5e5e5; color: #afafaf; box-shadow: none; cursor: not-allowed; }
.btn-green { background: linear-gradient(180deg, var(--green-bright), var(--green)); --btn-shadow: var(--green-dark); }
.btn-green:hover { filter: brightness(1.04); }
.btn-red { background: linear-gradient(180deg, #ff6b6b, var(--red)); --btn-shadow: var(--red-dark); }
.btn-blue { background: linear-gradient(180deg, #3ec2ff, var(--blue)); --btn-shadow: var(--blue-dark); }
.btn-white {
  background: #fff;
  color: var(--ink-2);
  border: 2px solid var(--line);
  box-shadow: 0 4px 0 #e0e0e0;
  --btn-shadow: #e0e0e0;
}
.btn-white:hover { background: #fafafa; }
.btn-block { width: 100%; }
.btn .ico { width: 20px; height: 20px; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: background 0.15s ease, color 0.15s ease;
}
.icon-btn:hover { background: var(--soft); color: var(--ink-2); }
.icon-btn .ico { width: 21px; height: 21px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 11px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 850;
  letter-spacing: 0.4px;
  white-space: nowrap;
}
.pill-green { background: var(--green-soft); color: var(--green-deep); }
.pill-purple { background: var(--purple-soft); color: var(--purple-dark); }
.pill-blue { background: var(--blue-soft); color: var(--blue-dark); }
.pill-white { background: #fff; color: var(--green-deep); border: 2px solid #dcefc6; }
.pill-ghost { background: var(--soft); color: var(--muted); }

.tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 7px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.6px;
}
.tag-4 { background: var(--green-soft); color: var(--green-dark); }
.tag-6 { background: var(--purple-soft); color: var(--purple-dark); }

.pos {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.3px;
}

.mascot { display: block; width: 100%; height: auto; }

/* ============ 顶部栏 ============ */

.appbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0 2px;
  gap: 8px;
}
.brand { display: flex; align-items: center; gap: 9px; }
.logo {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 19px;
  font-weight: 900;
  background: linear-gradient(160deg, #8ce84a 0%, var(--green) 55%, #46b800 100%);
  box-shadow: 0 3px 0 var(--green-dark), inset 0 1.5px 0 rgba(255, 255, 255, 0.5);
  padding-bottom: 1px;
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.05; }
.brand-txt b { font-size: 16px; font-weight: 900; letter-spacing: 0.5px; }
.brand-txt span {
  font-size: 8.5px;
  font-weight: 800;
  letter-spacing: 1.7px;
  color: var(--muted);
  text-transform: uppercase;
}
.stats { display: flex; align-items: center; gap: 5px; }
.stat {
  display: flex;
  align-items: center;
  gap: 4px;
  height: 30px;
  padding: 0 8px 0 7px;
  border-radius: 10px;
  background: var(--soft);
  font-size: 12.5px;
  font-weight: 850;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.stat .ico { width: 15px; height: 15px; }
.stat-flame { color: #d97900; background: #fff3e0; }
.stat-heart { color: #e33; background: #ffecec; }
.stats .stat:last-child { padding-right: 9px; }

/* ============ 首页 Hero ============ */

.hero {
  position: relative;
  margin-top: 12px;
  padding: 15px 17px 13px;
  border-radius: 22px;
  background:
    radial-gradient(120px 120px at 88% 18%, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0) 70%),
    linear-gradient(135deg, #f3fce8 0%, #e2f8c9 55%, #d3f3b0 100%);
  overflow: hidden;
  border: 2px solid #e4f5d2;
}
.hero::after {
  content: "";
  position: absolute;
  right: -46px;
  bottom: -60px;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.35);
}
.hero-copy { position: relative; z-index: 2; max-width: 68%; }
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 4px;
  font-size: 10.5px;
  font-weight: 850;
  color: #5c8c22;
  letter-spacing: 0.4px;
}
.hero-eyebrow .ico { width: 13px; height: 13px; color: #f08a00; }
.hero h1 {
  margin: 0 0 3px;
  font-size: 21px;
  line-height: 1.2;
  font-weight: 900;
  letter-spacing: -0.2px;
  color: #2c4d0a;
}
.hero p { font-size: 12px; font-weight: 600; color: #5e7a3c; }
.hero p b { color: #3f6b0b; font-weight: 900; }
.hero-mascot {
  position: absolute;
  right: 4px;
  bottom: -8px;
  width: 104px;
  z-index: 1;
  filter: drop-shadow(0 8px 14px rgba(63, 122, 12, 0.16));
}
.goal { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
.ring {
  --pct: 60;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: conic-gradient(var(--green) calc(var(--pct) * 1%), #d9edc4 0);
  display: grid;
  place-items: center;
  position: relative;
  flex: none;
  box-shadow: inset 0 0 0 1px rgba(88, 204, 2, 0.08);
}
.ring::before {
  content: "";
  position: absolute;
  inset: 5px;
  background: #f6fded;
  border-radius: 50%;
}
.ring span {
  position: relative;
  font-size: 11.5px;
  font-weight: 900;
  color: var(--green-deep);
  font-variant-numeric: tabular-nums;
}
.goal-txt { display: flex; flex-direction: column; gap: 1px; }
.goal-txt b { font-size: 14px; font-weight: 900; color: #2c4d0a; font-variant-numeric: tabular-nums; }
.goal-txt span { font-size: 10px; font-weight: 700; color: #7d9a5c; letter-spacing: 0.3px; }

/* ============ 课程卡 ============ */

.course-card {
  width: 100%;
  margin-top: 14px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 18px;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.course-card:hover { border-color: #cfeab4; transform: translateY(-1px); }
.course-flag {
  width: 50px;
  height: 50px;
  flex: none;
  border-radius: 13px;
  background: linear-gradient(160deg, #eafaDA, #d5f4b8);
  border: 2px solid #c9ecaa;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
  color: #3f7a0a;
}
.course-flag span { font-size: 8px; font-weight: 900; letter-spacing: 1px; }
.course-flag b { font-size: 22px; font-weight: 900; margin-top: 1px; }
.course-info { flex: 1; min-width: 0; }
.course-kicker {
  font-size: 10.5px;
  font-weight: 850;
  color: var(--green-dark);
  letter-spacing: 0.5px;
}
.course-info h2 { font-size: 16.5px; font-weight: 900; margin: 2px 0 6px; letter-spacing: -0.2px; }
.mini-progress {
  width: 100%;
  height: 7px;
  background: #edf2e7;
  border-radius: 99px;
  overflow: hidden;
}
.mini-progress span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #8ce84a, var(--green));
}
.course-cta {
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: 50%;
  background: var(--green-soft);
  color: var(--green-dark);
  display: grid;
  place-items: center;
}
.course-cta .ico { width: 18px; height: 18px; }

/* ============ 学习路径 ============ */

.path-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0 2px;
}
.path-count { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.3px; }

.path-map {
  position: relative;
  width: 300px;
  max-width: 100%;
  margin: 0 auto;
}
.path-line { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }

.node {
  position: absolute;
  left: calc(50% + var(--x, 0px));
  top: var(--y, 0px);
  width: 68px;
  height: 68px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  color: #fff;
  z-index: 2;
  background: linear-gradient(180deg, #8ce84a 0%, #5fce10 55%, #4fb800 100%);
  box-shadow:
    0 6px 0 #3f9900,
    0 10px 16px rgba(88, 204, 2, 0.22),
    inset 0 2px 0 rgba(255, 255, 255, 0.45);
  transition: transform 0.15s ease, filter 0.15s ease;
}
.node:hover { filter: brightness(1.04); }
.node:active { transform: translate(-50%, -50%) translateY(2px); }
.node .ico { width: 28px; height: 28px; }
.node--done { background: linear-gradient(180deg, #9bf056, #58cc02 60%, #4bb500); }
.node--current {
  width: 74px;
  height: 74px;
  z-index: 3;
  background: linear-gradient(180deg, #a4f564 0%, #62d407 55%, #4caf00 100%);
  box-shadow:
    0 7px 0 #3f9900,
    0 14px 22px rgba(88, 204, 2, 0.32),
    inset 0 2px 0 rgba(255, 255, 255, 0.5);
}
.node--current::after {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 2.5px dashed rgba(88, 204, 2, 0.42);
  animation: spin 24s linear infinite;
}
.node--current .ico { width: 30px; height: 30px; }
.node-start {
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 2px;
  padding-left: 2px;
  color: #fff;
  text-shadow: 0 1px 0 rgba(47, 122, 0, 0.25);
}
.node--locked {
  background: linear-gradient(180deg, #efefef 0%, #e2e2e2 100%);
  color: #b5b5b5;
  box-shadow: 0 5px 0 #d2d2d2, inset 0 2px 0 #fff;
}
.node--locked .ico { width: 24px; height: 24px; }

.node-num {
  position: absolute;
  right: -5px;
  top: -5px;
  min-width: 22px;
  height: 22px;
  padding: 0 5px;
  border-radius: 11px;
  background: #fff;
  border: 2px solid #e4e4e4;
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 900;
  color: #9a9a9a;
  line-height: 1;
  box-shadow: 0 2px 5px rgba(40, 70, 20, 0.08);
}
.node--done .node-num { border-color: #d5ecbf; color: var(--green-dark); }
.node--locked .node-num { color: #b7b7b7; }

.node-cap {
  position: absolute;
  left: calc(50% + var(--x, 0px));
  top: calc(var(--y, 0px) + 56px);
  transform: translateX(-50%);
  width: max-content;
  max-width: 176px;
  text-align: center;
  font-size: 10.5px;
  font-weight: 750;
  color: #a3a3a3;
  letter-spacing: 0.2px;
  line-height: 1.3;
  padding: 1px 6px;
  border-radius: 7px;
  background: #fff;
  z-index: 3;
}
.node-cap b { color: var(--green-dark); font-weight: 900; }

.start-pill {
  position: absolute;
  left: calc(50% + var(--x, 0px));
  top: calc(var(--y, 0px) - 58px);
  transform: translateX(-50%);
  z-index: 4;
  padding: 6px 15px 7px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 12px;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.8px;
  color: var(--green-dark);
  box-shadow: 0 5px 0 #ececec, 0 10px 18px rgba(80, 110, 40, 0.08);
  animation: bob 2.6s ease-in-out infinite;
}
.start-pill::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  width: 10px;
  height: 10px;
  background: #fff;
  border-right: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
  transform: translateX(-50%) rotate(45deg);
  border-radius: 0 0 3px 0;
}
.path-mascot {
  position: absolute;
  left: calc(50% + var(--x, 0px) + 70px);
  top: calc(var(--y, 0px) - 2px);
  width: 74px;
  transform: translate(-6%, -50%);
  z-index: 1;
  filter: drop-shadow(0 8px 10px rgba(70, 120, 20, 0.14));
  animation: floaty 4s ease-in-out infinite;
}

.chapter-mini {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 14px 0 0;
}
.chapter-mini-info { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: 0.2px; }

/* ============ 章节 / 课程目录 ============ */

.chapter-banner {
  position: relative;
  margin-top: 22px;
  padding: 15px 16px 13px;
  border-radius: 20px;
  background:
    radial-gradient(130px 120px at 95% 0%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 70%),
    linear-gradient(135deg, #f4fce9 0%, #e6f8d2 100%);
  border: 2px solid #e0f2ca;
  overflow: hidden;
}
.chapter-banner-main { padding-right: 72px; }
.chapter-kicker {
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 0.7px;
  color: var(--green-dark);
}
.chapter-banner h2 {
  margin: 3px 0 2px;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -0.3px;
  color: #2f4f10;
}
.chapter-banner p { font-size: 10.5px; font-weight: 650; color: #7c915f; }
.chapter-badge {
  position: absolute;
  right: 15px;
  top: 14px;
  text-align: right;
  line-height: 1;
}
.chapter-badge b {
  font-size: 27px;
  font-weight: 900;
  color: var(--green-dark);
  font-variant-numeric: tabular-nums;
}
.chapter-badge b i { font-style: normal; font-size: 12px; color: #94ac7b; font-weight: 850; }
.chapter-badge span { display: block; margin-top: 3px; font-size: 9px; font-weight: 800; color: #94ac7b; letter-spacing: 0.3px; }
.chapter-line {
  height: 7px;
  margin-top: 11px;
  background: #dcecc9;
  border-radius: 99px;
  overflow: hidden;
}
.chapter-line span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #8ce84a, var(--green));
}

.chapter-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.chapter-row {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  background: #fff;
  border: 2px solid var(--line);
  border-radius: 14px;
  text-align: left;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.chapter-row:hover { border-color: #cfeab4; }
.chapter-row.active { border-color: #b5e494; background: var(--green-soft); }
.chapter-row.locked { opacity: 0.55; }
.chapter-no {
  width: 34px;
  height: 34px;
  flex: none;
  border-radius: 10px;
  background: var(--soft);
  color: var(--muted);
  display: grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 900;
}
.chapter-row.active .chapter-no { background: #fff; color: var(--green-dark); }
.chapter-main { flex: 1; min-width: 0; }
.chapter-main b { display: block; font-size: 12.5px; font-weight: 850; letter-spacing: 0.1px; }
.chapter-main span { display: block; margin-top: 2px; font-size: 9.5px; font-weight: 650; color: var(--muted); }
.chapter-state {
  flex: none;
  font-size: 10px;
  font-weight: 900;
  color: var(--green-dark);
  font-variant-numeric: tabular-nums;
}
.chapter-state .ico { width: 15px; height: 15px; }
.chapter-row.locked .chapter-state { color: #b0b0b0; }
.chapter-arrow { flex: none; display: grid; place-items: center; }
.chapter-arrow .ico { width: 16px; height: 16px; color: #b9b9b9; }
.chapter-row.active .chapter-arrow .ico { color: var(--green-dark); }

.tag-unit { background: #eef3ff; color: #5a7fc4; }

.course-progress {
  margin-top: 12px;
  padding: 13px 14px 12px;
  border: 2px solid var(--line);
  border-radius: 16px;
}
.course-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.course-progress-head b { font-size: 12.5px; font-weight: 900; }
.course-progress-head span { font-size: 10px; font-weight: 800; color: var(--muted); }
.course-progress p { margin-top: 7px; font-size: 10px; font-weight: 650; color: var(--muted); }

/* ============ 桌面端侧栏 ============ */

.rail { display: none; }

/* ============ 底部标签栏 ============ */

.tabbar {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--frame);
  z-index: 40;
  display: flex;
  align-items: stretch;
  gap: 2px;
  padding: 7px 10px calc(7px + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 2px solid #eef0ea;
}
.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 0 4px;
  border-radius: 12px;
  color: #b0b0b0;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 0.4px;
  transition: color 0.15s ease;
}
.tab-ico {
  width: 40px;
  height: 26px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  transition: background 0.15s ease;
}
.tab .ico { width: 23px; height: 23px; }
.tab.active { color: var(--green-dark); }
.tab.active .tab-ico { background: var(--green-soft); }

/* ============ 答题页 ============ */

.quiz { min-height: 100vh; display: flex; flex-direction: column; }
.quiz-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 18px 8px;
}
.qbar {
  flex: 1;
  height: 14px;
  border-radius: 99px;
  background: #e8e8e8;
  overflow: hidden;
  position: relative;
}
.qbar span {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #8ce84a, var(--green));
  position: relative;
  transition: width 0.4s cubic-bezier(0.22, 0.9, 0.3, 1);
}
.qbar span::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  top: 3px;
  height: 3px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.45);
}
.hearts {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 900;
  color: #e33;
  min-width: 38px;
  justify-content: flex-end;
  font-variant-numeric: tabular-nums;
}
.hearts .ico { width: 18px; height: 18px; }

.quiz-body {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
  padding: 4px 20px 268px;
  flex: 1;
}
.qmeta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.combo {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 900;
  color: #d97900;
  background: #fff3e0;
  padding: 4px 9px;
  border-radius: 999px;
}
.combo .ico { width: 13px; height: 13px; }
.qcount { font-size: 11.5px; font-weight: 750; color: var(--muted); letter-spacing: 0.2px; }
.qtitle {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -0.2px;
  color: var(--ink);
  margin-bottom: 2px;
}

.qword-block { text-align: center; padding: 14px 0 4px; }
.tag-row { display: flex; align-items: center; justify-content: center; gap: 7px; margin-bottom: 6px; }
.qword {
  font-size: 40px;
  line-height: 1.15;
  font-weight: 900;
  letter-spacing: -1.2px;
  color: #2e2e2e;
  word-break: break-word;
}
.qcn {
  font-size: 30px;
  line-height: 1.25;
  font-weight: 900;
  letter-spacing: -0.4px;
  color: #2e2e2e;
}
.qsub {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 650;
  letter-spacing: 0.2px;
}
.speak {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--blue-soft);
  color: var(--blue-dark);
  display: grid;
  place-items: center;
  box-shadow: 0 3px 0 #b9e4f7;
  transition: transform 0.12s ease;
}
.speak:active { transform: translateY(2px); box-shadow: 0 1px 0 #b9e4f7; }
.speak .ico { width: 20px; height: 20px; }

.cloze-card {
  margin-top: 10px;
  padding: 18px 16px;
  background: var(--soft);
  border: 2px solid #eee;
  border-radius: 18px;
  text-align: left;
}
.cloze-sentence {
  font-size: 19px;
  line-height: 1.55;
  font-weight: 700;
  color: #333;
  letter-spacing: 0.1px;
}
.blank {
  display: inline-block;
  min-width: 74px;
  border-bottom: 3px solid var(--green);
  color: var(--green-dark);
  text-align: center;
  font-weight: 900;
  line-height: 1.2;
}
.cloze-hint { margin-top: 9px; font-size: 11px; font-weight: 700; color: var(--muted); }

.options { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.option {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  min-height: 58px;
  padding: 9px 14px 13px;
  background: #fff;
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  border-radius: 16px;
  text-align: left;
  color: var(--ink);
  transition: border-color 0.14s ease, background 0.14s ease, transform 0.1s ease, opacity 0.2s ease;
}
.option:active { transform: translateY(2px); border-bottom-width: 2px; padding-bottom: 15px; }
.opt-key {
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 8px;
  background: var(--soft);
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 11.5px;
  font-weight: 900;
  color: #9a9a9a;
  transition: all 0.14s ease;
}
.opt-text { flex: 1; font-size: 15.5px; font-weight: 700; line-height: 1.35; }
.opt-en .opt-text { font-size: 17px; font-weight: 800; letter-spacing: 0.1px; }
.opt-mark { width: 22px; height: 22px; flex: none; opacity: 0; color: #fff; }
.opt-mark .ico { width: 22px; height: 22px; }
.opt-mark .ico path { stroke-width: 3.6; }

.option.is-selected {
  border-color: #7fd6ff;
  background: #f2fbff;
  border-bottom-color: #52c4f5;
}
.option.is-selected .opt-key { background: var(--blue); border-color: var(--blue); color: #fff; }
.option.is-correct {
  border-color: #89d94f;
  background: var(--green-soft);
  border-bottom-color: var(--green);
}
.option.is-correct .opt-key { background: var(--green); border-color: var(--green); color: #fff; }
.option.is-correct .opt-mark { opacity: 1; color: var(--green-dark); }
.option.is-wrong {
  border-color: #ff9a9b;
  background: var(--red-soft);
  border-bottom-color: var(--red);
}
.option.is-wrong .opt-key { background: var(--red); border-color: var(--red); color: #fff; }
.option.is-wrong .opt-text { color: #b82b2b; }
.option.is-wrong .opt-mark { opacity: 1; color: var(--red); }
.option.is-dim { opacity: 0.5; }

/* 拼写题 */
.spell-wrap { margin-top: 14px; }
.spell-input {
  width: 100%;
  height: 62px;
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  border-radius: 16px;
  background: #fff;
  padding: 0 18px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.spell-input::placeholder { color: #c9c9c9; font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
.spell-input:focus { border-color: #8fd9ff; background: #fbfeff; }
.spell-input.is-correct { border-color: var(--green); background: var(--green-soft); }
.spell-input.is-wrong { border-color: var(--red); background: var(--red-soft); }
.spell-hint {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 9px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--muted);
}
.spell-hint b { color: var(--ink-2); font-weight: 850; }

/* 答题底部反馈条 */
.quiz-foot {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 100%;
  max-width: var(--frame);
  z-index: 30;
  padding: 15px 20px calc(16px + env(safe-area-inset-bottom));
  background: #fff;
  border-top: 2px solid #f0f0f0;
  animation: footIn 0.28s cubic-bezier(0.22, 0.9, 0.3, 1) both;
}
.quiz-foot.is-right { background: #f2fde8; border-color: #d9f3bf; }
.quiz-foot.is-wrong { background: #fff0f0; border-color: #ffd2d3; }
.quiz-foot .btn-block { margin-top: 13px; }
.fb-head { display: flex; align-items: center; gap: 9px; }
.fb-badge {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #fff;
  flex: none;
}
.fb-badge.ok { background: var(--green); box-shadow: 0 2px 0 var(--green-dark); }
.fb-badge.bad { background: var(--red); box-shadow: 0 2px 0 var(--red-dark); }
.fb-badge .ico { width: 17px; height: 17px; }
.fb-head h3 { font-size: 17px; font-weight: 900; letter-spacing: -0.2px; }
.fb-head .fb-xp {
  margin-left: auto;
  font-size: 12px;
  font-weight: 900;
  color: var(--green-dark);
  background: #fff;
  border-radius: 999px;
  padding: 3px 9px;
}
.fb-head .fb-combo {
  font-size: 11px;
  font-weight: 900;
  color: #d97900;
  background: #fff3e0;
  border-radius: 999px;
  padding: 3px 8px;
}
.quiz-foot.is-right .fb-head h3 { color: #37740a; }
.quiz-foot.is-wrong .fb-head h3 { color: #c53030; }
.fb-word {
  margin-top: 7px;
  font-size: 14px;
  font-weight: 700;
  color: #4d4d4d;
}
.fb-word b { font-size: 15px; font-weight: 900; color: var(--ink); }
.fb-word span { color: #7f7f7f; font-weight: 650; }
.quiz-foot.is-wrong .fb-word { color: #a33; }
.fb-answer {
  margin-top: 7px;
  font-size: 13.5px;
  font-weight: 650;
  color: #9c3b3b;
}
.fb-answer b { color: #c53030; font-weight: 900; }
.fb-ex {
  margin-top: 5px;
  font-size: 12.5px;
  line-height: 1.45;
  font-weight: 600;
  color: #6f6f6f;
}
.fb-ex b { color: var(--green-dark); font-weight: 850; }
.quiz-foot.is-wrong .fb-ex b { color: #c53030; }
.fb-excn { margin-top: 2px; font-size: 11.5px; color: #9a9a9a; font-weight: 600; }
.quiz-foot.idle { padding-top: 13px; }
.foot-note {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: #b5b5b5;
  margin-top: 9px;
  letter-spacing: 0.3px;
}

/* ============ 结算页 ============ */

.result {
  padding: 14px 22px 26px;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  animation: screenIn 0.4s ease both;
}
.result-top { display: flex; align-items: center; justify-content: space-between; }
.result-hero { position: relative; text-align: center; padding: 6px 0 4px; }
.result-mascot {
  width: 132px;
  margin: 0 auto 2px;
  filter: drop-shadow(0 12px 18px rgba(63, 122, 12, 0.18));
  animation: popIn 0.55s cubic-bezier(0.22, 1.2, 0.4, 1) both;
}
.result-hero h1 {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -0.6px;
  color: #2c4d0a;
}
.result-sub { margin-top: 4px; font-size: 12.5px; font-weight: 650; color: var(--muted); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i {
  position: absolute;
  width: 8px;
  height: 14px;
  border-radius: 2px;
  opacity: 0.9;
  animation: confetti 2.8s ease-in-out infinite;
}
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 18px 0 16px; }
.stat-tile {
  border-radius: 16px;
  padding: 12px 6px 10px;
  text-align: center;
  border: 2px solid transparent;
}
.stat-tile-icon {
  width: 30px;
  height: 30px;
  margin: 0 auto 6px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.stat-tile-icon .ico { width: 17px; height: 17px; }
.stat-tile b { display: block; font-size: 21px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-tile small { display: block; margin-top: 2px; font-size: 10.5px; font-weight: 750; opacity: 0.72; }
.t-green { background: var(--green-soft); color: #37740a; }
.t-green .stat-tile-icon { background: #cdf3a9; color: #37740a; }
.t-yellow { background: var(--yellow-soft); color: #8a6200; }
.t-yellow .stat-tile-icon { background: #ffe485; color: #8a6200; }
.t-orange { background: #ffeedd; color: #a85b00; }
.t-orange .stat-tile-icon { background: #ffd3a3; color: #a85b00; }

.review-card {
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 16px;
}
.review-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.review-card-head h3 { font-size: 13.5px; font-weight: 900; }
.review-card-head span { font-size: 10.5px; font-weight: 750; color: var(--muted); }
.review-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 2px solid #f4f4f4;
}
.review-row:first-of-type { border-top: 0; }
.review-row .rw { flex: 1; min-width: 0; }
.review-row .rw b { font-size: 14.5px; font-weight: 850; letter-spacing: 0.1px; }
.review-row .rw span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-top: 1px; }
.review-row .speak { width: 32px; height: 32px; box-shadow: none; background: var(--soft); color: var(--muted); }
.review-row .speak .ico { width: 16px; height: 16px; }

.perfect-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  border-radius: 16px;
  background: linear-gradient(120deg, #f6ffe9, #e8fbd5);
  border: 2px solid #d9f3bf;
  margin-bottom: 16px;
}
.perfect-card .ico { width: 26px; height: 26px; color: var(--green); }
.perfect-card b { font-size: 13.5px; font-weight: 900; color: #37740a; }
.perfect-card p { font-size: 11.5px; color: #6c8a4d; font-weight: 600; margin-top: 2px; }

.goal-card {
  margin-bottom: 2px;
  padding: 13px 14px 12px;
  border-radius: 16px;
  background: #fbfef7;
  border: 2px solid #e6f4d6;
}
.goal-card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.goal-card-head b { font-size: 12.5px; font-weight: 900; color: #3f6b0b; }
.goal-card-head span { font-size: 11px; font-weight: 850; color: #7d9a5c; font-variant-numeric: tabular-nums; }
.goal-card p { margin-top: 7px; font-size: 10.5px; font-weight: 650; color: #8a9f72; }

.next-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  background: #fbfcf8;
  border: 2px solid var(--line);
}
.next-copy { flex: 1; min-width: 0; }
.next-copy span { display: block; font-size: 9.5px; font-weight: 850; color: var(--green-dark); letter-spacing: 0.5px; }
.next-copy b { display: block; margin-top: 2px; font-size: 13px; font-weight: 900; }
.next-copy small { display: block; margin-top: 1px; font-size: 9.5px; font-weight: 650; color: var(--muted); }
.next-arrow { width: 30px; height: 30px; border-radius: 50%; background: var(--green-soft); color: var(--green-dark); display: grid; place-items: center; flex: none; }
.next-arrow .ico { width: 16px; height: 16px; }

.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 16px; }

/* ============ 页面标题 ============ */

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 8px 0 12px;
}
.page-kicker {
  font-size: 10.5px;
  font-weight: 850;
  letter-spacing: 1.2px;
  color: var(--green-dark);
  text-transform: uppercase;
}
.page-head h1 {
  font-size: 27px;
  font-weight: 900;
  letter-spacing: -0.8px;
  margin-top: 3px;
  color: #2e2e2e;
}
.count-badge {
  font-size: 11px;
  font-weight: 850;
  color: var(--muted);
  background: var(--soft);
  padding: 5px 10px;
  border-radius: 999px;
}

/* ============ 词库 ============ */

.search {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 48px;
  padding: 0 12px;
  background: var(--soft);
  border: 2px solid transparent;
  border-radius: 14px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.search:focus-within { background: #fff; border-color: #9cdc6b; }
.search .ico { width: 19px; height: 19px; color: #a8a8a8; }
.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font-size: 14px;
  font-weight: 650;
  color: var(--ink);
}
.search input::placeholder { color: #a8a8a8; }
.search-clear {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #e2e2e2;
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 900;
  line-height: 1;
}

.chips {
  display: flex;
  gap: 7px;
  margin: 12px 0 4px;
  overflow-x: auto;
  padding: 2px 0 6px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  height: 33px;
  padding: 0 13px;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: #fff;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  transition: all 0.15s ease;
  white-space: nowrap;
}
.chip b { font-weight: 900; margin-left: 3px; opacity: 0.65; }
.chip.active {
  background: var(--green-soft);
  border-color: #b9e896;
  color: var(--green-deep);
}
.chip.active b { opacity: 0.8; }

.word-list { margin-top: 2px; }
.word-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 2px solid #f3f3f3;
}
.word-main { flex: 1; min-width: 0; }
.word-line { display: flex; align-items: center; gap: 6px; }
.word-line b { font-size: 16px; font-weight: 850; letter-spacing: 0.1px; }
.word-ph {
  font-size: 11.5px;
  color: #a0a0a0;
  font-weight: 600;
  margin-top: 1px;
  letter-spacing: 0.1px;
}
.word-cn { font-size: 12px; color: var(--ink-2); font-weight: 650; margin-top: 2px; }
.star-btn {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: #c9c9c9;
  flex: none;
}
.star-btn:hover { background: #fffaeb; color: var(--yellow-dark); }
.star-btn.on { color: var(--yellow); }
.star-btn .ico { width: 20px; height: 20px; }
.empty {
  text-align: center;
  padding: 34px 10px;
}
.empty .mascot { width: 92px; margin: 0 auto 8px; opacity: 0.9; }
.empty b { display: block; font-size: 14px; font-weight: 850; }
.empty span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }

/* ============ 复习 ============ */

.review-hero {
  position: relative;
  border-radius: 22px;
  padding: 18px;
  background:
    radial-gradient(140px 140px at 92% 10%, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 70%),
    linear-gradient(135deg, #eaf7ff 0%, #d8efff 60%, #c6e7ff 100%);
  border: 2px solid #d5ecfb;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 10px;
}
.review-copy { flex: 1; position: relative; z-index: 2; }
.review-hero h2 {
  font-size: 20px;
  line-height: 1.3;
  font-weight: 900;
  color: #144a68;
  letter-spacing: -0.4px;
  margin: 8px 0 5px;
}
.review-hero p { font-size: 11.5px; color: #5b83a0; font-weight: 600; line-height: 1.5; }
.review-badge {
  flex: none;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid #c9e8ff;

/* ============ 弹层 / Toast ============ */

#layer { position: fixed; inset: 0; z-index: 80; display: none; }
#layer.open { display: block; }
.modal-mask {
  position: absolute;
  inset: 0;
  background: rgba(30, 40, 20, 0.42);
  backdrop-filter: blur(2px);
  animation: fade 0.2s ease both;
}
.modal {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(340px, calc(100vw - 40px));
  background: #fff;
  border-radius: 22px;
  padding: 22px 20px 18px;
  text-align: center;
  box-shadow: 0 24px 60px rgba(20, 30, 10, 0.28);
  animation: popIn 0.3s cubic-bezier(0.22, 1.2, 0.4, 1) both;
}
.modal .mascot { width: 84px; margin: 0 auto 6px; }
.modal h3 { font-size: 18px; font-weight: 900; }
.modal p { font-size: 12px; line-height: 1.6; color: var(--muted); font-weight: 600; margin: 6px 0 16px; }
.modal-actions { display: flex; flex-direction: column; gap: 8px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 96px;
  transform: translate(-50%, 12px);
  z-index: 90;
  max-width: calc(100vw - 40px);
  background: #2e2e2e;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 10px 16px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s ease;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============ 动画 ============ */

@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes footIn {
  from { opacity: 0; transform: translate(-50%, 14px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.86); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes bob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-4px); }
}
@keyframes floaty {
  0%, 100% { transform: translate(-6%, -50%) translateY(0); }
  50% { transform: translate(-6%, -50%) translateY(-4px); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes confetti {
  0%, 100% { transform: translateY(0) rotate(8deg); opacity: 0.9; }
  50% { transform: translateY(10px) rotate(-14deg); opacity: 0.65; }
}

@media (prefers-reduced-motion: reduce) {

}
