      <path d="M100 24c-8-8-19-8-27 0 8 8 19 9 27 0Z" fill="#6FDB1E"/>
      <path d="M64 88c4-4.4 11-5.4 16-2.2" stroke="#3E8F00" stroke-width="4" stroke-linecap="round"/>
      <path d="M136 88c-4-4.4-11-5.4-16-2.2" stroke="#3E8F00" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="77" cy="109" rx="16" ry="17" fill="#fff"/>
      <ellipse cx="123" cy="109" rx="16" ry="17" fill="#fff"/>
      <ellipse cx="79.5" cy="111.5" rx="7.4" ry="8.4" fill="#2E4512"/>
      <ellipse cx="120.5" cy="111.5" rx="7.4" ry="8.4" fill="#2E4512"/>
      <circle cx="82" cy="108" r="2.9" fill="#fff"/>
      <circle cx="123" cy="108" r="2.9" fill="#fff"/>
      <ellipse cx="56" cy="136" rx="9" ry="5.4" fill="#FF9B9B" opacity=".5"/>
      <ellipse cx="144" cy="136" rx="9" ry="5.4" fill="#FF9B9B" opacity=".5"/>
      <path d="M90 134c4.6 6.6 15.4 6.6 20 0" stroke="#2F6B00" stroke-width="4.4" stroke-linecap="round"/>
    </svg>`;
  }

  /* ---------------- 存储 ---------------- */
  const KEY = 'wordleap:v2';
  const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';

  const SEED = {
    name: '同学',
    xp: 0,
    goal: 50,
    streak: 1,
    gems: 120,
    hearts: 5,
    learned: 0,
    accuracy: 0,
    completed: [],
    mistakes: {},
    saved: [],
    days: [0, 0, 0, 0, 0, 0, 0]
  };

  const DEMO = {
    name: 'Dong',
    xp: 30,
    goal: 50,
    streak: 12,
    gems: 480,
    hearts: 5,
    learned: 30,
    accuracy: 86,
    completed: ['u01', 'u02', 'u03'],
    mistakes: { available: 1, access: 2, annual: 1, specific: 1 },
    saved: ['abandon', 'policy', 'global'],
    days: [20, 35, 50, 15, 40, 50, 30]
  };

  function loadStore() {
    if (PREVIEW) return JSON.parse(JSON.stringify(DEMO));
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(SEED));
      return Object.assign(JSON.parse(JSON.stringify(SEED)), JSON.parse(raw));
    } catch (e) {
      return JSON.parse(JSON.stringify(SEED));
    }
  }
  let store = loadStore();
  function saveStore() {
    if (PREVIEW) return;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* 忽略隐私模式 */ }
  }

  /* ---------------- 工具 ---------------- */
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const byId = (id) => WORD_MAP[id];
  const pad2 = (n) => String(n).padStart(2, '0');
  const unitTag = (u) => `<span class="tag tag-unit">U${pad2(u)}</span>`;

  /* ---------------- 运行时状态 ---------------- */
  const app = {
    screen: 'home',
    filter: 'all',
    search: '',
    quiz: null,
    result: null,
    preview: false,
    activeChapter: 'c1'
  };

  /* ---------------- 通用 UI 片段 ---------------- */
  function appbar() {
    return `
    <header class="appbar">
      <div class="brand">
        <div class="logo">跃</div>
        <div class="brand-txt"><b>词跃</b><span>WordLeap</span></div>
      </div>
      <div class="stats">
        <div class="stat stat-flame" title="连续学习天数">${icon('flame')}<b>${store.streak}</b></div>
        <div class="stat" title="宝石">${icon('gem')}<b>${store.gems}</b></div>
        <div class="stat stat-heart" title="生命值">${icon('heart')}<b>${store.hearts}</b></div>
      </div>
    </header>`;
  }

  function greeting() {
    const h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 12) return '早上好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  const todayIndex = () => (new Date().getDay() + 6) % 7;

  function currentUnit() {
    return UNITS.find((u) => !store.completed.includes(u.id)) || UNITS[UNITS.length - 1];
  }
  function nextUnit(id) {
    const i = UNITS.findIndex((u) => u.id === id);
    return i >= 0 && i < UNITS.length - 1 ? UNITS[i + 1] : null;
  }
  function dueWords() {
    return Object.keys(store.mistakes)
      .filter((id) => WORD_MAP[id])
      .map((id) => ({ word: WORD_MAP[id], count: store.mistakes[id] }))
      .sort((a, b) => b.count - a.count);
  }

  /* ---------------- 首页 ---------------- */
  function chapterOf(unit) {
    return CHAPTER_MAP[unit.chapter] || CHAPTERS[0];
  }
  function chapterUnits(ch) {
    return ch.units.map((id) => UNIT_MAP[id]).filter(Boolean);
  }
  function firstIncomplete() {
    return UNITS.findIndex((u) => !store.completed.includes(u.id));
  }
  function unitUnlocked(unit) {
    const fi = firstIncomplete();
    return fi === -1 || UNITS.findIndex((u) => u.id === unit.id) <= fi;
  }
  function chapterUnlocked(ch) {
    return chapterUnits(ch).some(unitUnlocked);
  }
  function chapterDone(ch) {
    return chapterUnits(ch).filter((u) => store.completed.includes(u.id)).length;
  }

  function renderHome() {
    const cur = currentUnit();
    const ch = chapterOf(cur);
    const active = CHAPTER_MAP[app.activeChapter] || ch;
    const units = chapterUnits(active);
    const pct = Math.min(100, Math.round((store.xp / store.goal) * 100));
    const nextXp = Math.max(0, store.goal - store.xp);
    const doneCount = store.completed.length;
    const todayWord = byId(cur.words[0]);
    const due = dueWords();
    const chDone = chapterDone(active);
    const chPct = Math.round((chDone / units.length) * 100);
    const chComplete = chDone === units.length;

    mount(`
    <div class="screen">
      ${appbar()}

      <section class="hero">
        <div class="hero-copy">
          <span class="hero-eyebrow">CET-4 · 四级高频 300 词</span>
          <h1>${greeting()}，${esc(store.name)}</h1>
          <p>${nextXp > 0 ? `再学 <b>${nextXp} XP</b> 就完成今天的目标` : '今天的目标已完成，继续保持！'}</p>
          <div class="goal">
            <div class="ring" style="--pct:${pct}"><span>${pct}%</span></div>
            <div class="goal-txt"><b>${store.xp} / ${store.goal} XP</b><span>每日目标</span></div>
          </div>
        </div>
        <div class="hero-mascot">${mascot()}</div>
      </section>

      <div class="home-grid">
        <div class="home-main">
          <button class="course-card" data-act="unit" data-unit="${cur.id}">
            <div class="course-flag"><span>CET</span><b>4</b></div>
            <div class="course-info">
              <span class="course-kicker">第 ${cur.no} 关 · ${ch.title}</span>
              <h2>${cur.title}</h2>
              <div class="mini-progress"><span style="width:${chPct}%"></span></div>
            </div>
            <div class="course-cta">${icon('arrow')}</div>
          </button>

          <div class="chapter-mini">
            <span class="pill pill-green">第 ${active.no} 阶段 · ${active.title}</span>
            <span class="chapter-mini-info">${active.range} 词 · ${chDone}/${units.length} 关</span>
          </div>

          ${chapterPath(active)}
          ${chapterDirectory(active)}
        </div>

        <aside class="home-aside">
          <div class="aside-card">
            <h3>今日单词</h3>
            <div class="aside-word">
              <b>${todayWord.w}</b>
              <div class="ph">${todayWord.ph}${todayWord.pos ? ' · ' + todayWord.pos : ''}</div>
              <div class="cn">${todayWord.cn}</div>
              <button class="speak" data-act="speak" data-word="${todayWord.w}" aria-label="朗读">${icon('speaker')}</button>
            </div>
          </div>
          <div class="aside-card">
            <h3>连续打卡</h3>
            <div class="streak-line"><b>${store.streak}</b><span>天 · 保持住！</span></div>
            <div class="mini-bars">
              ${store.days.map((v) => {
                const max = Math.max.apply(null, store.days) || 1;
                return `<i class="${v > 0 ? 'on' : ''}" style="height:${Math.max(12, Math.round((v / max) * 100))}%"></i>`;
              }).join('')}
            </div>
          </div>
          <div class="aside-card">
            <h3>学习小贴士</h3>
            <p class="aside-tip">${due.length ? `错词本里还有 ${due.length} 个词在等你，复习比新学更划算。` : '每关 10 个词，约 3 分钟。先过一遍，再靠复习巩固。'}</p>
          </div>
        </aside>
      </div>
    </div>`);
  }

  const X_OFFSETS = [0, -58, 0, -58, 0];

  function chapterPath(ch) {
    const units = chapterUnits(ch);
    const cur = currentUnit();
    const startY = 58;
    const gap = 96;
    const nodes = units.map((u, i) => ({
      u,
      x: X_OFFSETS[i % X_OFFSETS.length],
      y: startY + i * gap
    }));
    const height = startY + (units.length - 1) * gap + 50;

    const nodeHTML = nodes.map(({ u, x, y }) => {
      const done = store.completed.includes(u.id);
      const isCur = cur.id === u.id && !done;
      const locked = !done && !isCur;
      const ic = done ? 'check' : locked ? 'lock' : 'book';
      const cls = done ? 'node node--done' : isCur ? 'node node--current' : 'node node--locked';
      return `
        <button class="${cls}" style="--x:${x}px;--y:${y}px" data-act="unit" data-unit="${u.id}" ${locked ? 'data-locked="1"' : ''} aria-label="第 ${u.no} 关 ${u.title}" title="第 ${u.no} 关 · ${u.title}">
          ${isCur ? '<span class="node-start">开始</span>' : icon(ic)}
          ${!isCur ? `<span class="node-num">${u.no}</span>` : ''}
        </button>
      `;
    }).join('');

    const curNode = nodes.find(({ u }) => cur.id === u.id && !store.completed.includes(u.id));

    return `
      <div class="path-map" style="height:${height}px">
        ${nodeHTML}
        ${curNode ? `<div class="path-mascot" style="--x:${curNode.x}px;--y:${curNode.y}px">${mascot()}</div>` : ''}
      </div>`;
  }

  function chapterDirectory(active) {
    return `
      <div class="section-title">
        <h2>课程目录</h2>
        <span>6 个阶段 · 30 关</span>
      </div>
      <div class="chapter-list">
        ${CHAPTERS.map((ch) => {
          const done = chapterDone(ch);
          const unlocked = chapterUnlocked(ch);
          const isActive = ch.id === active.id;
          const finished = done === ch.units.length;
          return `
            <button class="chapter-row${isActive ? ' active' : ''}${unlocked ? '' : ' locked'}" data-act="chapter" data-chapter="${ch.id}" ${unlocked ? '' : 'data-locked="1"'}>
              <span class="chapter-no">${pad2(ch.no)}</span>
              <span class="chapter-main">
                <b>${ch.title}</b>
                <span>${ch.range} 词 · ${done}/${ch.units.length} 关</span>
              </span>
              <span class="chapter-state">
                ${!unlocked ? icon('lock') : finished ? icon('check') : `${done}/${ch.units.length}`}
              </span>
              <span class="chapter-arrow">${unlocked ? icon('arrow') : ''}</span>
            </button>`;
        }).join('')}
      </div>`;
  }

  /* ---------------- 答题 ---------------- */
  function buildOptions(word, kind, pool) {
    const others = pool.filter((w) => w.id !== word.id);
    const distract = shuffle(others).slice(0, 3);
    const values = [kind === 'cn' ? word.cn : word.w].concat(
      distract.map((w) => (kind === 'cn' ? w.cn : w.w))
    );
    const options = shuffle(values);
    return { options, answer: options.indexOf(kind === 'cn' ? word.cn : word.w) };
  }

  function makeQuestion(word, type, pool) {
    if (type === 'cloze' && !word.cloze) type = 'en2cn';
    if (type === 'spell') {
      return {
        type,
        word,
        title: '根据中文拼出单词',
        pill: '拼写题'
      };
    }
    if (type === 'cloze') {
      const re = new RegExp(`\\b${escRe(word.w)}\\b`, 'i');
      const sentence = word.ex.replace(re, '<span class="blank">_____</span>');
      const { options, answer } = buildOptions(word, 'en', pool);
      return { type, word, title: '选词填空，补全句子', pill: '选词填空', sentence, options, answer };
    }
    if (type === 'cn2en') {
      const { options, answer } = buildOptions(word, 'en', pool);
      return { type, word, title: '选择正确的英文单词', pill: '中译英', options, answer };
    }
    const { options, answer } = buildOptions(word, 'cn', pool);
    return { type, word, title: '选择正确的中文意思', pill: '英译中', options, answer };
  }

  function startQuiz(opts) {
    const unit = opts.unitId ? UNIT_MAP[opts.unitId] : null;
    const ids = opts.wordIds || (unit ? unit.words : []);
    const words = ids.map(byId).filter(Boolean);
    if (!words.length) {
      toast('还没有要复习的单词');
      return;
    }
    const pool = WORDS;
    const pattern = ['en2cn', 'cloze', 'cn2en', 'en2cn', 'spell', 'cloze', 'cn2en', 'en2cn', 'spell', 'cloze'];
    const questions = words.map((w, i) => makeQuestion(w, pattern[i % pattern.length], pool));
    app.quiz = {
      unitId: unit ? unit.id : null,
      title: unit ? unit.title : '错词复习',
      chapter: unit ? unit.chapter : null,
      wordIds: ids.slice(),
      questions,
      qi: 0,
      picked: null,
      checked: false,
      input: '',
      correct: 0,
      combo: 0,
      maxCombo: 0,
      xp: 0,
      hearts: 5,
      wrong: [],
      preview: !!opts.preview || PREVIEW
    };
    go('quiz');
  }

  function curQ() {
    return app.quiz.questions[app.quiz.qi];
  }

  function renderQuiz() {
    if (!app.quiz) { go('home'); return; }
    const q = app.quiz;
    const question = curQ();
    const total = q.questions.length;
    const pct = Math.round(((q.qi + (q.checked ? 1 : 0)) / total) * 100);
    const isLast = q.qi === total - 1;

    mount(`
    <div class="quiz">
      <header class="quiz-top">
        <button class="icon-btn" data-act="quit" aria-label="退出">${icon('close')}</button>
        <div class="qbar"><span style="width:${Math.max(4, pct)}%"></span></div>
        <div class="hearts">${icon('heart')}<b>${q.hearts}</b></div>
      </header>

      <div class="quiz-body">
        <div class="qmeta">
          <span class="pill pill-ghost">${question.pill}</span>
          ${q.combo >= 2 ? `<span class="combo">${icon('flame')}连击 ×${q.combo}</span>` : `<span class="qcount">第 ${q.qi + 1} / ${total} 题</span>`}
        </div>
        <h2 class="qtitle">${question.title}</h2>
        ${questionBlock(question)}
        ${question.type === 'spell' ? spellBlock(question) : optionsBlock(question)}
      </div>

      ${feedbackBlock(question, isLast)}
    </div>`);
  }

  function questionBlock(q) {
    const w = q.word;
    const tagRow = `<div class="tag-row">${unitTag(w.u)}<span class="pos">${w.pos}</span></div>`;
    if (q.type === 'en2cn') {
      return `
        <div class="qword-block">
          ${tagRow}
          <div class="qword">${w.w}</div>
          <div class="qsub">
            <button class="speak" data-act="speak" data-word="${w.w}" aria-label="朗读">${icon('speaker')}</button>
            <span>${w.ph}</span>
          </div>
        </div>`;
    }
    if (q.type === 'cn2en') {
      return `
        <div class="qword-block">
          ${tagRow}
          <div class="qcn">${w.cn}</div>
          <div class="qsub"><span>${w.ph}</span></div>
        </div>`;
    }
    if (q.type === 'cloze') {
      return `
        <div class="cloze-card">
          <div class="cloze-sentence">${q.sentence}</div>
          <div class="cloze-hint">提示：${w.pos} · 四级高频</div>
        </div>`;
    }
    return `
      <div class="qword-block">
        ${tagRow}
        <div class="qcn">${w.cn}</div>
        <div class="qsub">
          <button class="speak" data-act="speak" data-word="${w.w}" aria-label="朗读">${icon('speaker')}</button>
          <span>${w.ph}</span>
        </div>
      </div>`;
  }

  function optionsBlock(q) {
    const picked = app.quiz.picked;
    const checked = app.quiz.checked;
    return `<div class="options">${q.options.map((opt, i) => {
      let cls = 'option';
      if (q.type !== 'en2cn') cls += ' opt-en';
      let mark = '';
      if (checked) {
        if (i === q.answer) {
          cls += ' is-correct';
          mark = icon('check');
        } else if (i === picked) {
          cls += ' is-wrong';
          mark = icon('close');
        } else {
          cls += ' is-dim';
        }
      } else if (i === picked) {
        cls += ' is-selected';
      }
      return `
        <button class="${cls}" data-act="option" data-index="${i}" ${checked ? 'aria-disabled="true"' : ''}>
          <span class="opt-key">${String.fromCharCode(65 + i)}</span>
          <span class="opt-text">${esc(opt)}</span>
          <span class="opt-mark">${mark}</span>
        </button>`;
    }).join('')}</div>`;
  }

  function spellBlock(q) {
    const w = q.word;
    const state = app.quiz.checked ? (app.quiz.lastOk ? ' is-correct' : ' is-wrong') : '';
    return `
      <div class="spell-wrap">
        <input id="spell-input" class="spell-input${state}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="输入英文单词…" value="${esc(app.quiz.input)}" ${app.quiz.checked ? 'readonly' : ''}>
        <div class="spell-hint">
          <span>共 <b>${w.w.length}</b> 个字母</span>
          <span>首字母 <b>${w.w[0].toUpperCase()}</b></span>
        </div>
      </div>`;
  }

  function highlightExample(w) {
    if (!w.ex) return '';
    const re = new RegExp(`\\b${escRe(w.w)}\\b`, 'i');
    return w.ex.replace(re, (m) => `<b>${m}</b>`);
  }

  function feedbackBlock(question, isLast) {
    const q = app.quiz;
    if (!q.checked) {
      const needPick = question.type !== 'spell' && q.picked === null;
      return `
        <footer class="quiz-foot idle">
          <button class="btn btn-green btn-block" data-act="check" ${needPick ? 'disabled' : ''}>检查</button>
          <div class="foot-note">${question.type === 'spell' ? '拼写不区分大小写，Enter 也可以提交' : '选择答案后检查 · 答错会进入错词本'}</div>
        </footer>`;
    }
    const w = question.word;
    const isRight = !!q.lastOk;

    if (isRight) {
      return `
        <footer class="quiz-foot is-right" role="status">
          <div class="fb-head">
            <span class="fb-badge ok">${icon('check')}</span>
            <h3>太棒了！</h3>
            ${q.combo >= 2 ? `<span class="fb-combo">连击 ×${q.combo}</span>` : ''}
            <span class="fb-xp">+3 XP</span>
          </div>
          <p class="fb-word"><b>${w.w}</b> <span>${w.cn}</span></p>
          ${w.ex ? `<p class="fb-ex">${highlightExample(w)}</p>` : ''}
          <button class="btn btn-green btn-block" data-act="next">${isLast ? '查看结果' : '继续'}</button>
        </footer>`;
    }
    return `
      <footer class="quiz-foot is-wrong" role="status">
        <div class="fb-head">
          <span class="fb-badge bad">${icon('close')}</span>
          <h3>差一点！</h3>
          <span class="fb-xp" style="color:#c53030;background:#fff">${q.combo === 0 ? '连击中断' : '再试一次'}</span>
        </div>
        <p class="fb-answer">正确答案：<b>${w.w}</b> ${w.cn}</p>
        ${w.ex ? `<p class="fb-ex">${highlightExample(w)}</p>` : ''}
        ${w.exCn ? `<p class="fb-excn">${w.exCn}</p>` : ''}
        <button class="btn btn-red btn-block" data-act="next">${isLast ? '查看结果' : '继续'}</button>
      </footer>`;
  }

  function checkAnswer() {
    const q = app.quiz;
    if (!q || q.checked) return;
    const question = curQ();
    let ok;
    if (question.type === 'spell') {
      const val = (q.input || '').trim();
      if (!val) { toast('先把单词拼出来吧'); return; }
      ok = val.toLowerCase() === question.word.w.toLowerCase();
      q.picked = val.toLowerCase();
    } else {
      if (q.picked === null) { toast('先选一个答案吧'); return; }
      ok = q.picked === question.answer;
    }
    q.checked = true;
    q.lastOk = ok;
    if (ok) {
      q.correct++;
      q.combo++;
      q.maxCombo = Math.max(q.maxCombo, q.combo);
      q.xp += 3;
    } else {
      q.combo = 0;
      q.hearts = Math.max(0, q.hearts - 1);
      q.wrong.push(question.word.id);
    }
    renderQuiz();
  }

  function nextQuestion() {
    const q = app.quiz;
    if (!q || !q.checked) return;
    if (q.qi < q.questions.length - 1) {
      q.qi++;
      q.picked = null;
      q.checked = false;
      q.input = '';
      renderQuiz();
      window.scrollTo(0, 0);
      return;
    }
    finishQuiz();
  }

  function finishQuiz() {
    const q = app.quiz;
    const total = q.questions.length;
    const pct = Math.round((q.correct / total) * 100);
    const perfect = q.correct === total;
    const passed = q.correct / total >= 0.6;
    const xpEarned = q.correct * 3 + (perfect ? 5 : 0);
    const next = q.unitId ? nextUnit(q.unitId) : null;

    if (!q.preview) {
      store.xp += xpEarned;
      store.accuracy = store.accuracy ? Math.round((store.accuracy * 4 + pct) / 5) : pct;
      store.days[todayIndex()] = (store.days[todayIndex()] || 0) + xpEarned;
      if (q.unitId && passed && !store.completed.includes(q.unitId)) {
        store.completed.push(q.unitId);
        store.learned += q.questions.length;
      }
      q.questions.forEach((item) => {
        const id = item.word.id;
        if (q.wrong.includes(id)) store.mistakes[id] = (store.mistakes[id] || 0) + 1;
        else delete store.mistakes[id];
      });
      saveStore();
      renderChrome();
    }

    app.result = {
      total,
      correct: q.correct,
      pct,
      xpEarned,
      maxCombo: q.maxCombo,
      wrong: q.wrong.map(byId).filter(Boolean),
      title: q.title,
      chapter: q.chapter,
      unitId: q.unitId,
      wordIds: q.wordIds,
      passed,
      nextId: passed && next ? next.id : null,
      preview: q.preview
    };
    go('result');
  }

  /* ---------------- 结算 ---------------- */
  function renderResult() {
    if (!app.result) { go('home'); return; }
    const r = app.result;
    const passed = r.passed !== false;
    const isReview = !r.unitId;
    const confettiColors = ['#58cc02', '#1cb0f6', '#ffc800', '#ce82ff', '#ff9600', '#ff4b4b'];
    const confetti = Array.from({ length: 14 }, (_, i) => {
      const left = 8 + ((i * 37) % 84);
      const top = 4 + ((i * 19) % 46);
      return `<i style="left:${left}%;top:${top}%;background:${confettiColors[i % 6]};animation-delay:${(i % 7) * 0.18}s;transform:rotate(${i * 27}deg)"></i>`;
    }).join('');

    const afterXp = r.preview ? 45 : store.xp;
    const goalPct = Math.min(100, Math.round((afterXp / store.goal) * 100));
    const remainXp = Math.max(0, store.goal - afterXp);

    const nextData = r.nextId ? UNIT_MAP[r.nextId] : null;
    const wrongHTML = r.wrong.length
      ? `<section class="review-card">
          <div class="review-card-head"><h3>错词回顾</h3><span>已加入错词本</span></div>
          ${r.wrong.slice(0, 3).map((w) => `
            <div class="review-row">
              <div class="rw"><b>${w.w}</b><span>${w.cn}</span></div>
              <button class="speak" data-act="speak" data-word="${w.w}" aria-label="朗读">${icon('speaker')}</button>
            </div>`).join('')}
        </section>`
      : `<div class="perfect-card">
          ${icon('star')}
          <div><b>全对通关，太强了！</b><p>这一关的单词已经稳稳记住，去挑战下一关吧。</p></div>
        </div>`;

    mount(`
      <div class="result">
        <header class="result-top">
          <span class="pill pill-green">${r.unitId ? '本关结算' : '复习结算'}</span>
          <button class="icon-btn" data-act="nav" data-screen="home" aria-label="回到首页">${icon('close')}</button>
        </header>

        <div class="result-hero">
          <div class="confetti">${confetti}</div>
          <div class="result-mascot">${mascot()}</div>
          <h1>${passed ? (isReview ? '复习完成！' : '本关完成！') : '再来一次吧'}</h1>
          <p class="result-sub">${passed ? `${esc(r.title)} · ${r.total} 个单词` : `正确率 ${r.pct}%，达到 60% 就能通关`}</p>
        </div>

        <div class="stat-grid">
          <div class="stat-tile t-green">
            <div class="stat-tile-icon">${icon('target')}</div>
            <b>${r.pct}%</b><small>正确率</small>
          </div>
          <div class="stat-tile t-yellow">
            <div class="stat-tile-icon">${icon('bolt')}</div>
            <b>+${r.xpEarned}</b><small>获得经验</small>
          </div>
          <div class="stat-tile t-orange">
            <div class="stat-tile-icon">${icon('flame')}</div>
            <b>${r.maxCombo}</b><small>最高连击</small>
          </div>
        </div>

        ${wrongHTML}

        <div class="goal-card">
          <div class="goal-card-head"><b>今日目标</b><span>${afterXp} / ${store.goal} XP</span></div>
          <div class="mini-progress"><span style="width:${goalPct}%"></span></div>
          <p>${remainXp > 0 ? `再得 ${remainXp} XP 就达标，继续保持！` : '今日目标已达成，太棒了！'}</p>
        </div>

        ${nextData ? `<div class="next-card">
          <div class="next-copy"><span>下一关</span><b>${nextData.title}</b><small>${nextData.sub} · 约 3 分钟</small></div>
          <span class="next-arrow">${icon('arrow')}</span>
        </div>` : ''}

        <div class="result-actions">
          ${passed
            ? (r.nextId
              ? `<button class="btn btn-green btn-block" data-act="result-next">继续下一关 ${icon('arrow')}</button>`
              : `<button class="btn btn-green btn-block" data-act="result-next">返回学习地图 ${icon('arrow')}</button>`)
            : `<button class="btn btn-green btn-block" data-act="result-again">再练一次 ${icon('repeat')}</button>`}
          ${passed
            ? `<button class="btn btn-white btn-block" data-act="result-again">再练一次</button>`
            : `<button class="btn btn-white btn-block" data-act="result-next">返回学习地图</button>`}
        </div>
      </div>`);
  }

  /* ---------------- 词库 ---------------- */
  function filteredWords() {
    let arr = WORDS.slice();
    if (app.filter === 'saved') arr = arr.filter((w) => store.saved.includes(w.id));
    if (app.filter === 'mistakes') arr = arr.filter((w) => store.mistakes[w.id]);
    if (app.filter === 'new') arr = arr.filter((w) => !store.completed.includes(UNITS[w.u - 1].id));
    const q = app.search.trim().toLowerCase();
    if (q) {
      arr = arr.filter((w) => w.w.toLowerCase().includes(q) || w.cn.includes(q));
    }
    return arr;
  }

  function wordRowsHTML() {
    const list = filteredWords();
    if (!list.length) {
      return `<div class="empty">${mascot()}<b>没找到这个单词</b><span>试试换个拼写，或切到「全部」看看</span></div>`;
    }
    return list.map((w) => {
      const saved = store.saved.includes(w.id);
      return `
        <div class="word-row">
          <div class="word-main">
            <div class="word-line"><b>${w.w}</b>${unitTag(w.u)}</div>
            <div class="word-ph">${w.ph}${w.ph ? ' · ' : ''}${w.pos}</div>
            <div class="word-cn">${w.cn}</div>
          </div>
          <button class="icon-btn" data-act="speak" data-word="${w.w}" aria-label="朗读 ${w.w}">${icon('speaker')}</button>
          <button class="star-btn ${saved ? 'on' : ''}" data-act="star" data-word="${w.id}" aria-label="收藏">${icon('star')}</button>
        </div>`;
    }).join('');
  }

  function renderWords() {
    const counts = {
      all: WORDS.length,
      new: WORDS.filter((w) => !store.completed.includes(UNITS[w.u - 1].id)).length,
      mistakes: WORDS.filter((w) => store.mistakes[w.id]).length,
      saved: store.saved.length
    };
    const chips = [
      ['all', '全部'],
      ['new', '未学'],
      ['mistakes', '生词'],
      ['saved', '收藏']
    ].map(([id, label]) => `
      <button class="chip ${app.filter === id ? 'active' : ''}" data-act="filter" data-filter="${id}">
        ${label}<b>${counts[id]}</b>
      </button>`).join('');

    mount(`
      <div class="screen">
        <header class="page-head">
          <div>
            <span class="page-kicker">Vocabulary</span>
            <h1>词库</h1>
          </div>
          <span class="count-badge">${WORDS.length} 词</span>
        </header>

        <div class="search">
          ${icon('search')}
          <input id="word-search" type="text" placeholder="搜索单词或中文释义" value="${esc(app.search)}" autocomplete="off">
          <button id="search-clear" class="search-clear" data-act="clear-search" style="display:${app.search ? 'grid' : 'none'}" aria-label="清空">×</button>
        </div>

        <div class="chips">${chips}</div>
        <div class="word-list" id="word-list">${wordRowsHTML()}</div>
      </div>`);
  }

  function applyWordFilter() {
    const list = $('#word-list');
    if (list) list.innerHTML = wordRowsHTML();
    const clear = $('#search-clear');
    if (clear) clear.style.display = app.search ? 'grid' : 'none';
  }

  /* ---------------- 复习 ---------------- */
  function renderReview() {
    const due = dueWords();
    const total = due.length;
    mount(`
      <div class="screen">
        <header class="page-head">
          <div>
            <span class="page-kicker">Review</span>
            <h1>复习</h1>
          </div>
          <span class="count-badge">${total} 词待复习</span>
        </header>

        <section class="review-hero">
          <div class="review-copy">
            <span class="pill pill-blue">今日复习</span>
            <h2>趁热打铁，<br>把模糊的词捡回来</h2>
            <p>按错误次数排序，先复习最不熟的词，每次 3 分钟。</p>
          </div>
          <div class="review-badge"><b>${total}</b><span>待复习</span></div>
        </section>

        <button class="btn btn-blue btn-block" data-act="review-start" ${total ? '' : 'disabled'}>
          ${total ? `开始复习 · ${total} 个词` : '暂无待复习单词'}
        </button>

        <div class="section-title">
          <h2>错词本</h2>
          <span>${total ? '按错误次数排序' : '干干净净'}</span>
        </div>

        ${due.length ? due.map(({ word, count }) => `
          <div class="mistake-row">
            <div class="mk-icon">×${count}</div>
            <div class="mk-main"><b>${word.w}</b><span>${word.cn}</span></div>
            <button class="speak" data-act="speak" data-word="${word.w}" aria-label="朗读">${icon('speaker')}</button>
          </div>`).join('') : `<div class="empty">${mascot()}<b>错词本是空的</b><span>答错的词会自动收进来，复习后再练一次</span></div>`}

        <div class="tip-card">
          ${icon('info')}
          <div>
            <b>为什么复习比新学更划算？</b>
            <p>遗忘曲线显示，学完 24 小时内复习一次，记忆留存率能提升一倍以上。</p>
          </div>
        </div>
      </div>`);
  }

  /* ---------------- 我的 ---------------- */
  function renderProfile() {
    const maxDay = Math.max.apply(null, store.days) || 1;
    const days = ['一', '二', '三', '四', '五', '六', '日'];
    const ti = todayIndex();
    mount(`
      <div class="screen">
        <header class="page-head">
          <div>
            <span class="page-kicker">Profile</span>
            <h1>我的</h1>
          </div>
          <button class="icon-btn" data-act="toast" data-msg="设置页还在框架阶段" aria-label="设置">${icon('settings')}</button>
        </header>

        <section class="profile-card">
          <div class="avatar">${mascot()}</div>
          <div class="profile-main">
            <h2>${esc(store.name)} 同学</h2>
            <p>已加入 ${store.streak} 天 · 目标：CET-4 通过</p>
            <span class="level-badge">${icon('star')} Lv.3 词汇学徒</span>
          </div>
        </section>

        <div class="course-progress">
          <div class="course-progress-head">
            <b>四级高频 300 词</b>
            <span>${store.completed.length}/${UNITS.length} 关</span>
          </div>
          <div class="mini-progress"><span style="width:${Math.round((store.completed.length / UNITS.length) * 100)}%"></span></div>
          <p>已学 ${store.learned} 词 · 还剩 ${Math.max(0, WORDS.length - store.learned)} 词</p>
        </div>

        <div class="stat-strip">
          <div class="stat-cell"><b>${store.streak}</b><span>连续天数</span></div>
          <div class="stat-cell"><b>${store.learned}</b><span>已学单词</span></div>
          <div class="stat-cell"><b>${store.accuracy ? store.accuracy + '%' : '—'}</b><span>最近正确率</span></div>
        </div>

        <section class="chart-card">
          <div class="chart-head"><h3>本周学习</h3><span>共 ${store.days.reduce((a, b) => a + b, 0)} XP</span></div>
          <div class="bars">
            ${store.days.map((v, i) => `
              <div class="bar-wrap ${i === ti ? 'today' : ''}">
                <div class="bar ${v > 0 ? 'on' : ''} ${i === ti ? 'today' : ''}" style="height:${Math.max(4, Math.round((v / maxDay) * 100))}%"></div>
                <span>${days[i]}</span>
              </div>`).join('')}
          </div>
        </section>

        <div class="badges">
          <div class="badge ${store.streak >= 7 ? 'on' : ''}"><div class="badge-ico">${icon('flame')}</div><b>连续 7 天</b><span>${store.streak >= 7 ? '已达成' : `还差 ${7 - store.streak} 天`}</span></div>
          <div class="badge ${store.learned >= 100 ? 'on' : ''}"><div class="badge-ico">${icon('star')}</div><b>词汇新手</b><span>学完 100 词</span></div>
          <div class="badge"><div class="badge-ico">${icon('medal')}</div><b>满分通关</b><span>单关全对</span></div>
        </div>

        <div class="settings">
          <button class="setting-row" data-act="toast" data-msg="每日目标将在正式版开放">${icon('target')}每日目标<span class="val">${store.goal} XP</span></button>
          <button class="setting-row" data-act="toast" data-msg="发音设置将在正式版开放">${icon('volume')}单词发音<span class="val">美式</span></button>
          <button class="setting-row" data-act="reset">${icon('repeat')}重置学习进度<span class="val">清空</span></button>
        </div>
      </div>`);
  }

  /* ---------------- 侧栏 / 标签栏 ---------------- */
  function renderChrome() {
    const due = dueWords().length;
    $('#rail').innerHTML = `
      <div class="rail-brand">
        <div class="logo">跃</div>
        <div><b>词跃</b><span>WordLeap</span></div>
      </div>
      <nav class="rail-nav">
        <button class="rail-item" data-act="nav" data-screen="home">${icon('compass')}学习路径</button>
        <button class="rail-item" data-act="nav" data-screen="words">${icon('book')}我的词库<span class="rail-count">${WORDS.length}</span></button>
        <button class="rail-item" data-act="nav" data-screen="review">${icon('repeat')}今日复习<span class="rail-count">${due}</span></button>
        <button class="rail-item" data-act="nav" data-screen="profile">${icon('user')}我的</button>
      </nav>
      <div class="rail-foot">
        <div class="rail-goal">
          <p>今日目标 · ${store.xp} / ${store.goal} XP</p>
          <div class="streak-line"><b>${store.streak}</b><span>天连续学习</span></div>
          <div class="mini-progress"><span style="width:${Math.min(100, Math.round((store.xp / store.goal) * 100))}%"></span></div>
        </div>
        <button class="rail-reset" data-act="reset">重置学习进度</button>
        <div class="rail-version">300 词 · 30 关 · 进度保存在本地</div>
      </div>`;

    $('#tabbar').innerHTML = `
      <button class="tab" data-act="nav" data-screen="home"><span class="tab-ico">${icon('compass')}</span>学习</button>
      <button class="tab" data-act="nav" data-screen="words"><span class="tab-ico">${icon('book')}</span>词库</button>
      <button class="tab" data-act="nav" data-screen="review"><span class="tab-ico">${icon('repeat')}</span>复习</button>
      <button class="tab" data-act="nav" data-screen="profile"><span class="tab-ico">${icon('user')}</span>我的</button>`;
    syncNav(app.screen);
  }

  function syncNav(screen) {
    const active = screen === 'quiz' || screen === 'result' ? 'home' : screen;
    $$('[data-screen]').forEach((el) => {
      if (el.classList.contains('tab') || el.classList.contains('rail-item')) {
        el.classList.toggle('active', el.dataset.screen === active);
      }
    });
  }

  /* ---------------- 路由 ---------------- */
  function mount(html) {
    $('#screen').innerHTML = html;
  }

  function go(screen) {
    app.screen = screen;
    document.body.classList.toggle('focus-mode', screen === 'quiz' || screen === 'result');
    syncNav(screen);
    if (screen === 'home') {
      const cur = currentUnit();
      app.activeChapter = chapterOf(cur).id;
      renderHome();
    }
    else if (screen === 'words') renderWords();
    else if (screen === 'review') renderReview();
    else if (screen === 'profile') renderProfile();
    else if (screen === 'quiz') renderQuiz();
    else if (screen === 'result') renderResult();
    window.scrollTo(0, 0);
  }

  /* ---------------- 弹层 / Toast ---------------- */
  let toastTimer = null;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function openModal(opts) {
    const layer = $('#layer');
    layer.innerHTML = `
      <div class="modal-mask" data-act="close-modal"></div>
      <div class="modal">
        ${opts.mascot !== false ? mascot() : ''}
        <h3>${opts.title}</h3>
        <p>${opts.text || ''}</p>
        <div class="modal-actions">
          ${(opts.actions || []).map((a) => `
            <button class="btn ${a.cls || 'btn-white'} btn-block" data-act="${a.act}" ${a.value ? `data-value="${a.value}"` : ''}>${a.label}</button>`).join('')}
        </div>
      </div>`;
    layer.classList.add('open');
  }

  function closeModal() {
    $('#layer').classList.remove('open');
    $('#layer').innerHTML = '';
  }

  /* ---------------- 发音 ---------------- */
  function speak(text) {
    if (!('speechSynthesis' in window)) {
      toast('当前浏览器不支持朗读');
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.86;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find((x) => /en[-_]US/i.test(x.lang)) || voices.find((x) => /^en/i.test(x.lang));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {
      toast('朗读失败，请检查系统语音');
    }
  }

  /* ---------------- 交互 ---------------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'nav') {
      if (app.screen === 'quiz' && app.quiz && !app.quiz.checked && app.quiz.qi >= 0) {
        confirmQuit();
        return;
      }
      go(el.dataset.screen);
    } else if (act === 'chapter') {
      if (el.dataset.locked) {
        toast('完成前一阶段后解锁');
        return;
      }
      app.activeChapter = el.dataset.chapter;
      renderHome();
      setTimeout(() => {
        const banner = $('.chapter-mini');
        if (banner) banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 30);
    } else if (act === 'unit') {
      if (el.dataset.locked) {
        toast('先完成前面的关卡，再解锁这里');
        return;
      }
      startQuiz({ unitId: el.dataset.unit });
    } else if (act === 'option') {
      if (!app.quiz || app.quiz.checked) return;
      app.quiz.picked = Number(el.dataset.index);
      updateOptionUI();
    } else if (act === 'check') {
      checkAnswer();
    } else if (act === 'next') {
      nextQuestion();
    } else if (act === 'quit') {
      confirmQuit();
    } else if (act === 'speak') {
      speak(el.dataset.word);
    } else if (act === 'star') {
      const id = el.dataset.word;
      const i = store.saved.indexOf(id);
      if (i >= 0) store.saved.splice(i, 1);
      else store.saved.push(id);
      saveStore();
      el.classList.toggle('on', store.saved.includes(id));
      const chip = $$('.chip').find((c) => c.dataset.filter === 'saved');
      if (chip) chip.innerHTML = `收藏<b>${store.saved.length}</b>`;
      if (app.filter === 'saved') renderWords();
      toast(store.saved.includes(id) ? '已加入收藏' : '已取消收藏');
    } else if (act === 'filter') {
      app.filter = el.dataset.filter;
      renderWords();
    } else if (act === 'clear-search') {
      app.search = '';
      const input = $('#word-search');
      if (input) { input.value = ''; input.focus(); }
      applyWordFilter();
    } else if (act === 'review-start') {
      const ids = dueWords().map((x) => x.word.id);
      startQuiz({ wordIds: ids });
    } else if (act === 'result-next') {
      const r = app.result;
      if (r && r.nextId) startQuiz({ unitId: r.nextId });
      else go('home');
    } else if (act === 'result-again') {
      const r = app.result;
      if (r && r.unitId) startQuiz({ unitId: r.unitId });
      else if (r && r.wordIds) startQuiz({ wordIds: r.wordIds });
      else go('home');
    } else if (act === 'reset') {
      openModal({
        title: '重置学习进度？',
        text: '将清空本地保存的关卡、经验、收藏与错词记录，从第 1 关重新开始。',
        actions: [
          { label: '保留进度', act: 'close-modal', cls: 'btn-white' },
          { label: '确认重置', act: 'do-reset', cls: 'btn-red' }
        ]
      });
    } else if (act === 'do-reset') {
      store = JSON.parse(JSON.stringify(PREVIEW ? DEMO : SEED));
      saveStore();
      closeModal();
      renderChrome();
      go('home');
      toast('学习进度已重置');
    } else if (act === 'confirm-quit') {
      closeModal();
      app.quiz = null;
      go('home');
    } else if (act === 'close-modal') {
      closeModal();
    } else if (act === 'toast') {
      toast(el.dataset.msg || '该功能将在后续版本开放');
    }
  });

  function updateOptionUI() {
    const q = app.quiz;
    if (!q) return;
    $$('.option').forEach((el, i) => {
      el.classList.toggle('is-selected', i === q.picked);
    });
    const btn = $('[data-act="check"]');
    if (btn) btn.disabled = false;
  }

  function confirmQuit() {
    if (!app.quiz) { go('home'); return; }
    openModal({
      title: '要离开本关吗？',
      text: '当前答题进度不会保存，已获得的经验也不会累计。',
      actions: [
        { label: '继续学习', act: 'close-modal', cls: 'btn-green' },
        { label: '离开本关', act: 'confirm-quit', cls: 'btn-white' }
      ]
    });
  }

  document.addEventListener('input', (e) => {
    if (e.target.id === 'word-search') {
      app.search = e.target.value;
      applyWordFilter();
    }
    if (e.target.id === 'spell-input' && app.quiz) {
      app.quiz.input = e.target.value;
    }
  });

  document.addEventListener('keydown', (e) => {
    if ($('#layer').classList.contains('open')) {
      if (e.key === 'Escape') closeModal();
      return;
    }
    if (app.screen !== 'quiz' || !app.quiz) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (app.quiz.checked) nextQuestion();
      else checkAnswer();
      return;
    }
    if (e.key === 'Escape') {
      confirmQuit();
      return;
    }
    if (/^[1-4]$/.test(e.key) && !app.quiz.checked && curQ().type !== 'spell') {
      const i = Number(e.key) - 1;
      if (i < curQ().options.length) {
        app.quiz.picked = i;
        updateOptionUI();
      }
    }
  });

  /* ---------------- 预览模式（用于生成设计稿截图） ---------------- */
  function setupPreview(params) {
    const screen = params.get('screen') || 'home';
    app.preview = true;
    if (screen === 'quiz') {
      const unitId = params.get('unit') || 'u04';
      const qIndex = Math.max(0, Math.min(Number(params.get('q') || 0), 9));
      startQuiz({ unitId, preview: true });
      app.quiz.qi = Math.min(qIndex, app.quiz.questions.length - 1);
      const question = curQ();
      const mode = params.get('pick') || 'wrong';
      let forced = false;
      if (mode === 'wrong' && question.type === 'en2cn' && question.word.w === 'commercial') {
        question.options = ['商业的；商品化的；商务的', '每年的；年度的；一年一次的', '公司的；法人的；企业的', '摘要；总结；概要'];
        question.answer = 0;
        app.quiz.picked = 1;
        app.quiz.hearts = 4;
        app.quiz.wrong = [question.word.id];
        app.quiz.checked = true;
        app.quiz.lastOk = false;
        forced = true;
      }
      if (mode !== 'none' && !forced) {
        if (mode === 'right') {
          app.quiz.picked = question.type === 'spell' ? question.word.w : question.answer;
          app.quiz.correct = 1;
          app.quiz.combo = 3;
          app.quiz.maxCombo = 3;
          app.quiz.xp = 3;
          if (question.type === 'spell') app.quiz.input = question.word.w;
        } else {
          app.quiz.picked = question.type === 'spell'
            ? 'wrong'
            : question.options.findIndex((_, i) => i !== question.answer);
          app.quiz.hearts = 4;
          app.quiz.wrong = [question.word.id];
          if (question.type === 'spell') app.quiz.input = 'wrod';
        }
        app.quiz.checked = true;
        app.quiz.lastOk = mode === 'right';
      }
      renderQuiz();
    } else if (screen === 'result') {
      const unit = UNIT_MAP.u04;
      app.result = {
        total: 10,
        correct: 9,
        pct: 90,
        xpEarned: 27,
        maxCombo: 7,
        wrong: [byId('annual')],
        title: unit.title,
        chapter: unit.chapter,
        unitId: unit.id,
        wordIds: unit.words.slice(),
        passed: true,
        nextId: 'u05',
        preview: true
      };
      app.screen = 'result';
      document.body.classList.add('focus-mode');
      syncNav('result');
      renderResult();
      window.scrollTo(0, 0);
    } else if (screen === 'words') {
      go('words');
    } else if (screen === 'review') {
      go('review');
    } else if (screen === 'profile') {
      go('profile');
    } else {
      app.activeChapter = 'c1';
      go('home');
    }
  }

  /* ---------------- 启动 ---------------- */
  function init() {
    renderChrome();
    const params = new URLSearchParams(location.search);
    if (params.get('preview') === '1') setupPreview(params);
    else go('home');
  }

  document.addEventListener('DOMContentLoaded', init);
})();

  </script>
</body>
</html>
